<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-[2px]" (click)="closed.emit()">
  <section class="w-full max-w-md overflow-hidden rounded-2xl border border-white/60 bg-white shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="login-title" (click)="$event.stopPropagation()">
    <div class="bg-[#0b2545] px-6 py-5 text-white">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-xl bg-white/10 ring-1 ring-white/15">
            <svg lucideIcon="lock-keyhole" [size]="22"></svg>
          </div>
          <h2 id="login-title" class="text-xl font-bold tracking-tight">Acessar painel</h2>
          <p class="mt-1 text-sm text-blue-100/80">Entre para liberar a gestão de permissões.</p>
        </div>
        <button type="button" class="rounded-lg p-2 text-white/75 transition hover:bg-white/10 hover:text-white" aria-label="Fechar" (click)="closed.emit()">
          <svg lucideIcon="x" [size]="20"></svg>
        </button>
      </div>
    </div>

    <form class="space-y-5 p-6" (ngSubmit)="login()">
      <div>
        <label class="mb-2 block text-sm font-semibold text-slate-700" for="login-email">E-mail</label>
        <input id="login-email" name="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" autocomplete="username" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10" placeholder="usuario@prefeitura.gov.br">
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-slate-700" for="login-password">Senha</label>
        <div class="relative">
          <input id="login-password" name="password" [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()" (ngModelChange)="password.set($event)" autocomplete="current-password" class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 pr-11 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10" placeholder="Digite sua senha">
          <button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Exibir senha" (click)="showPassword.set(!showPassword())">
            <svg [lucideIcon]="showPassword() ? 'eye-off' : 'eye'" [size]="18"></svg>
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="rounded-xl border border-red-200 bg-red-50 px-3.5 py-3 text-sm text-red-700">{{ errorMessage() }}</p>
      }

      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
        <app-button type="button" variant="ghost" (pressed)="closed.emit()">Cancelar</app-button>
        <app-button type="submit">Entrar</app-button>
      </div>

      <button type="button" class="w-full rounded-xl border border-dashed border-slate-200 px-4 py-3 text-left text-xs text-slate-500 transition hover:border-blue-300 hover:bg-blue-50/50" (click)="useDemo()">
        <span class="font-semibold text-slate-700">Acesso de demonstração</span><br>
        admin@prefeitura.gov.br · senha 123456
      </button>
    </form>
  </section>
</div>
