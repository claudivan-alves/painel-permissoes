<header class="bg-[#0b2545] text-white shadow-lg">
  <div class="mx-auto flex min-h-[76px] max-w-[1440px] items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-3 sm:gap-4">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/15 bg-white/10 p-1.5 shadow-inner sm:h-12 sm:w-12">
        <img src="assets/logo-painel.svg" alt="" class="h-full w-full" />
      </div>
      <div class="min-w-0">
        <h1 class="truncate text-base font-bold tracking-tight sm:text-lg">Painel de Permissões</h1>
        <p class="truncate text-[11px] text-blue-100/70 sm:text-xs">Sistema de Gestão de Acesso</p>
      </div>
    </div>

    <button type="button" class="flex shrink-0 items-center gap-2 rounded-xl px-2 py-1.5 text-left transition hover:bg-white/10 sm:gap-3 sm:px-3" (click)="user() ? logoutRequested.emit() : loginRequested.emit()">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-[#0b2545] sm:h-10 sm:w-10"><svg lucideIcon="circle-user-round" [size]="24"></svg></div>
      <div class="hidden min-w-0 sm:block">
        @if (user(); as currentUser) {
          <strong class="block max-w-40 truncate text-xs font-bold">{{ currentUser.name }}</strong>
          <span class="block max-w-40 truncate text-[11px] text-blue-100/70">{{ currentUser.email }}</span>
        } @else {
          <strong class="block text-xs font-bold">Acessar</strong>
          <span class="block text-[11px] text-blue-100/70">Entrar no painel</span>
        }
      </div>
      @if (user()) { <svg lucideIcon="log-out" [size]="17" class="text-blue-100/70"></svg> } @else { <svg lucideIcon="log-in" [size]="17" class="text-blue-100/70"></svg> }
    </button>
  </div>
</header>
