<section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
  <div class="mb-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-50 text-[#0b416f]"><svg lucideIcon="filter" [size]="18"></svg></div>
      <div><h2 class="text-base font-bold text-slate-900">Filtros de acesso</h2><p class="text-xs text-slate-400">Defina o contexto da permissão.</p></div>
    </div>
    <button type="button" [disabled]="!enabled()" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700 disabled:cursor-not-allowed disabled:opacity-40" aria-label="Limpar filtros" (click)="reset.emit()"><svg lucideIcon="rotate-ccw" [size]="16"></svg></button>
  </div>

  <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
    <div><label class="mb-1.5 block text-xs font-semibold text-slate-600">Secretaria</label><app-select [disabled]="!enabled()" [value]="secretary()" placeholder="Selecione a secretaria" [options]="secretaries" (changed)="filterChanged.emit({field: 'secretary', value: $event})"></app-select></div>
    <div><label class="mb-1.5 block text-xs font-semibold text-slate-600">Local de trabalho</label><app-select [disabled]="!enabled()" [value]="workplace()" placeholder="Selecione o local de trabalho" [options]="workplaces" (changed)="filterChanged.emit({field: 'workplace', value: $event})"></app-select></div>
    <div><label class="mb-1.5 block text-xs font-semibold text-slate-600">Usuário</label><app-select [disabled]="!enabled()" [value]="user()" placeholder="Selecione o usuário" [options]="userOptions" (changed)="filterChanged.emit({field: 'user', value: $event})"></app-select></div>
  </div>

  @if (!enabled()) {
    <div class="mt-4 rounded-xl border border-dashed border-slate-200 bg-slate-50 px-3 py-2.5 text-xs text-slate-500">Faça login pelo perfil no cabeçalho para liberar os filtros e a gestão das permissões.</div>
  }
</section>
