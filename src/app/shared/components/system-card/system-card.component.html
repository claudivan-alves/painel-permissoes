<article class="group relative rounded-2xl border border-slate-200 bg-white p-3 shadow-sm transition sm:p-4" [class.opacity-60]="!enabled()" [class.grayscale]="!enabled()">
  <div class="flex items-center gap-3">
    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-[#0b416f] ring-1 ring-blue-100">
      <svg [lucideIcon]="system().icon" [size]="21"></svg>
    </div>

    <div class="min-w-0 flex-1">
      <h3 class="truncate text-sm font-bold text-slate-800">{{ system().name }}</h3>
      <p class="mt-0.5 hidden truncate text-xs text-slate-400 sm:block">{{ system().description }}</p>
    </div>

    <div class="relative shrink-0">
      <button type="button" [disabled]="!enabled()" class="flex h-9 min-w-[142px] items-center justify-between gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 text-xs font-semibold text-slate-600 transition hover:border-slate-300 hover:bg-white disabled:cursor-not-allowed" (click)="menu.open = !menu.open">
        <span class="truncate">{{ permissionLabel() }}</span>
        @if (enabled()) { <svg lucideIcon="chevron-down" [size]="15"></svg> } @else { <svg lucideIcon="lock-keyhole" [size]="14"></svg> }
      </button>

      @if (enabled() && menu.open) {
        <div class="absolute right-0 top-11 z-30 w-64 overflow-hidden rounded-xl border border-slate-200 bg-white p-1.5 shadow-xl">
          <button type="button" class="w-full rounded-lg px-3 py-2 text-left text-xs font-semibold text-slate-600 hover:bg-slate-50" (click)="selectPermission({id: '', name: 'Sem Permissão', description: ''}); menu.open = false">Sem Permissão</button>
          @for (permission of system().permissions; track permission.id) {
            <button type="button" class="w-full rounded-lg px-3 py-2 text-left hover:bg-blue-50" (click)="selectPermission(permission); menu.open = false">
              <span class="block text-xs font-semibold text-slate-700">{{ permission.name }}</span>
              <span class="block text-[11px] text-slate-400">{{ permission.description }}</span>
            </button>
          }
        </div>
      }
    </div>
  </div>
</article>
